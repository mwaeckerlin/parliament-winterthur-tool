services:
  # Production deployment for parlwin.
  #
  # Mirrors mwaeckerlin/nextcloud → example/docker-compose.yml: same volumes,
  # same networks, same traefik front. Differences:
  #   * nextcloud-php-fpm uses mwaeckerlin/parliament-winterthur-tool:php-fpm
  #     (seeds the app)
  #   * an extra service mwaeckerlin/parliament-winterthur-tool:realtime provides the
  #     realtime backend
  #     reachable through the generic /ws/<appid>/ proxy of nextcloud-nginx
  #
  # Required configuration in .env: HOST, LETSENCRYPT_EMAIL,
  # NEXTCLOUD_DB_PASSWORD, NEXTCLOUD_ADMIN_PASSWORD. Every other variable has
  # a default; .env.sample lists each one with its default and its effect.

  traefik:
    # Die Routing-Konfiguration steckt im Image (COPY), nicht in einem Mount:
    # kein Host-Verzeichnis im Container, kein Docker-Socket. Der Build-Root ist
    # das Verzeichnis des Dockerfiles, dynamic.yml liegt daneben. Nach einer
    # Änderung am Routing: docker compose up -d --build traefik
    build:
      context: traefik
    # Der Name trägt keinen Registry-Namensraum: Dieses Image entsteht
    # ausschliesslich hier beim Bauen, Docker Hub kennt es nicht. Mit
    # «mwaeckerlin/…» hätte es wie ein herunterladbares Image ausgesehen.
    image: parlwin-traefik
    # Ohne diese Angabe würde ein «--pull always» es in einer Registry suchen.
    pull_policy: build
    command:
      # Kein Docker-Provider: er verlangte den Docker-Socket im Container.
      # Das Routing kommt aus der ins Image kopierten Datei; sie ändert sich zur
      # Laufzeit nicht, deshalb wird sie auch nicht überwacht.
      - --providers.docker=false
      - --providers.file.filename=/etc/traefik/dynamic.yml
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.web.http.redirections.entrypoint.permanent=true
      - --certificatesresolvers.letsencrypt.acme.email=${LETSENCRYPT_EMAIL}
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.letsencrypt.acme.httpchallenge=true
      - --certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web
      # Produktions-Loglevel. Zur Fehlersuche vorübergehend auf DEBUG setzen —
      # nie als ausgelieferter Standard.
      - --log.level=INFO
      - --log.format=json
      - --accesslog=true
      - --accesslog.format=json
      - --api.dashboard=true
      - --api.insecure=true
    ports:
      # alle Adressen des Rechners, IPv4 und IPv6, ausser BIND_ADDRESS nennt eine
      - "${BIND_ADDRESS:+${BIND_ADDRESS:-}:}80:80"
      - "${BIND_ADDRESS:+${BIND_ADDRESS:-}:}443:443"
    volumes:
      - traefik-letsencrypt:/letsencrypt
    networks:
      - traefik-nginx
    restart: ${RESTART_POLICY:-unless-stopped}

  nextcloud-nginx:
    # Das nginx-Image DIESES Projekts. Es baut auf mwaeckerlin/nextcloud:nginx
    # auf und legt den Reverse-Proxy /ws/parlwin/ dazu; dieselbe Marke läuft in
    # allen Tests, sodass die Auslieferung dasselbe Image fährt wie der Lauf,
    # der sie prüft.
    image: mwaeckerlin/parliament-winterthur-tool:nginx-v1.10.1
    environment:
      WEBROOT:
      # so lange wartet nginx auf die Antwort von PHP, gleich lange wie PHP rechnen darf
      MAX_INPUT_TIME: ${MAX_INPUT_TIME:-3600}
    volumes:
      - apps:/app/custom_apps:ro
    depends_on:
      nextcloud-php-fpm:
        condition: service_started
    networks:
      - php-network
      - collabora-network
      - realtime-network
      - traefik-nginx
    restart: ${RESTART_POLICY:-unless-stopped}

  nextcloud-php-fpm:
    image: mwaeckerlin/parliament-winterthur-tool:php-fpm-v1.10.1
    environment:
      HOST: ${HOST}
      PROTOCOL: ${PROTOCOL:-https}
      WEBROOT: ${WEBROOT}
      MYSQL_HOST: nextcloud-db
      MYSQL_USER: nextcloud
      MYSQL_DATABASE: nextcloud
      PARLWIN_PHP_MEMORY_LIMIT: ${PARLWIN_PHP_MEMORY_LIMIT:-1024M}
      # pm.max_children: so viele PHP-Prozesse beantworten gleichzeitig Anfragen
      MAX_REQUEST_WORKERS: ${MAX_REQUEST_WORKERS:-8}
      # max_execution_time und max_input_time in Sekunden
      MAX_INPUT_TIME: ${MAX_INPUT_TIME:-3600}
    # Bei Speichermangel beendet der Kernel einen Prozess dieses Containers statt der Datenbank.
    # Mindestens PARLWIN_PHP_MEMORY_LIMIT plus 256MiB, sonst beendet der Kernel einen Import vor der Meldung von PHP.
    mem_limit: ${PHP_FPM_MEM_LIMIT:-1280m}
    secrets:
      - nextcloud_db_password
      - nextcloud_admin_password
    volumes:
      - data:/app/data
      - config:/app/config
      - apps:/app/custom_apps
    depends_on:
      nextcloud-db:
        condition: service_started
      collabora:
        condition: service_started
    networks:
      - php-network
      - db-network
      - smtp-network
      - collabora-network
      - realtime-network
    restart: ${RESTART_POLICY:-unless-stopped}

  # Realtime broadcaster for parlwin. Reached by browsers same-origin under
  # /ws/parlwin/, proxied by nextcloud-nginx (this project's image carries that
  # location; the alias parlwin-ws below also satisfies the generic
  # /ws/<appid>/ rule of the base image).
  parlwin-realtime:
    image: mwaeckerlin/parliament-winterthur-tool:realtime-v1.10.1
    networks:
      realtime-network:
        aliases:
          - parlwin-ws
    restart: ${RESTART_POLICY:-unless-stopped}

  smtp-relay:
    image: mwaeckerlin/smtp-relay
    networks:
      - smtp-network
    restart: ${RESTART_POLICY:-unless-stopped}

  collabora:
    image: collabora/code
    environment:
      server_name: ${HOST}
      domain: nextcloud-nginx|${HOST}|www.${HOST}
      aliasgroup1: http://nextcloud-nginx:8080,https://${HOST},https://www.${HOST}
      extra_params: --o:ssl.enable=false --o:ssl.termination=true
    cap_add:
      - MKNOD
    networks:
      collabora-network:
        aliases:
          - ${HOST}
      traefik-nginx:
    restart: ${RESTART_POLICY:-unless-stopped}

  nextcloud-db:
    image: mariadb
    environment:
      MYSQL_DATABASE: nextcloud
      MYSQL_USER: nextcloud
      MYSQL_PASSWORD_FILE: /run/secrets/nextcloud_db_password
      MYSQL_RANDOM_ROOT_PASSWORD: yes
    secrets:
      - nextcloud_db_password
    volumes:
      - db:/var/lib/mysql
    networks:
      - db-network
    restart: ${RESTART_POLICY:-unless-stopped}

  access-fix:
    image: mwaeckerlin/allow-write-access
    volumes:
      - data:/app/data
      - config:/app/config
      - apps:/app/custom_apps
    restart: ${RESTART_POLICY:-unless-stopped}

secrets:
  nextcloud_db_password:
    environment: NEXTCLOUD_DB_PASSWORD
  nextcloud_admin_password:
    environment: NEXTCLOUD_ADMIN_PASSWORD

volumes:
  traefik-letsencrypt:
  data:
  config:
  apps:
  db:

networks:
  traefik-nginx:
    driver_opts:
      encrypted: 1
  php-network:
    driver_opts:
      encrypted: 1
  db-network:
    driver_opts:
      encrypted: 1
  smtp-network:
    driver_opts:
      encrypted: 1
  collabora-network:
    driver_opts:
      encrypted: 1
  realtime-network:
    driver_opts:
      encrypted: 1
