services:
  nextcloud-nginx:
    ports: !reset []

  # Die Datenbank meldet selbst, wann sie Verbindungen annimmt. Ohne diese
  # Meldung beginnt Nextcloud seine Installation, während MariaDB noch
  # hochfährt, und probiert es blind wieder: Am 01.09.2026 lief der Testlauf
  # deshalb in die Wartegrenze («Nextcloud wurde nicht rechtzeitig
  # initialisiert»), während die Installation danach noch fertig wurde.
  nextcloud-db:
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 3s
      timeout: 5s
      retries: 40
      start_period: 10s

  nextcloud-php-fpm:
    environment:
      # Kurzer Cron-Tick für den E2E-Test (Produktion: 300s Default im Watcher),
      # damit der automatische Background-Job-Lauf im Test zügig greift.
      PARLWIN_CRON_INTERVAL: "5"
    depends_on:
      nextcloud-db:
        condition: service_healthy

  parlwin-realtime:
    ports: !reset []

  # Browser-basierter Multi-User-E2E-Test. Läuft im selben Compose-Netz und
  # erreicht Nextcloud daher über den internen Hostnamen nextcloud-nginx:8080.
  # Wird gezielt über `docker compose run --rm playwright` aus run-compose-e2e.sh
  # gestartet (Profil verhindert Autostart bei `docker compose up`).
  playwright:
    # Eigenes Image: @playwright/test und die Testdateien sind eingebacken, damit
    # der Testlauf ohne npm, ohne npm-Registry und ohne Zugriff auf das Arbeits-
    # verzeichnis des Hosts auskommt (siehe Dockerfile.playwright).
    build:
      # Relative Pfade löst Compose gegen das Projektverzeichnis auf (= Repo-Wurzel),
      # nicht gegen den Speicherort dieser Datei. Der Context umfasst nur die Tests.
      context: tests/e2e
      dockerfile: Dockerfile.playwright
    image: mwaeckerlin/parliament-winterthur-tool:playwright
    profiles: ["tools"]
    # Muss im selben Netz wie nextcloud-nginx liegen, sonst ist der interne
    # Hostname nextcloud-nginx:8080 nicht auflösbar.
    networks:
      - nginx-php
    # KEINE Bind-Mounts: Testdateien kommen per COPY ins Image, der JUnit-Report
    # wird nach dem Lauf per `docker cp` herausgeholt (run-compose-e2e.sh). Ein
    # gemountetes Repo würde den Lauf an lokale Arbeitsstände koppeln und dem
    # Container Schreibzugriff auf die Arbeitskopie geben.
    environment:
      PARLWIN_BASE_URL: "http://nextcloud-nginx:8080"
      PW_U1: "${PW_U1:-parlwin_praesidium}"
      PW_P1: "${PW_P1:-}"
      PW_U2: "${PW_U2:-parlwin_protokoll}"
      PW_P2: "${PW_P2:-}"
      PW_U3: "${PW_U3:-parlwin_mitglied}"
      PW_P3: "${PW_P3:-}"
      PW_ADMIN_PASS: "${PW_ADMIN_PASS:-}"
      # Filter für eine gezielte Messung an einem einzelnen Test; leer heisst alle.
      PW_GREP: "${PW_GREP:-}"
      CI: "1"
    # Kein `npm ci` mehr: @playwright/test steckt im Image (NODE_PATH), die Tests
    # ebenso. Der Lauf ist damit unabhängig von der npm-Registry. Das Kommando
    # kommt aus dem Dockerfile (CMD).
