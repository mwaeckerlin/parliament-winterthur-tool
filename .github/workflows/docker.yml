# Builds the images of this repository for amd64 and arm64 and publishes them on
# Docker Hub: on every push to master and to the version branches, and once a
# week for the security fixes of the base images. The build itself is the
# reusable workflow docker-image.yml of mwaeckerlin/scratch; its README explains
# the setup.
#
# One branch per Nextcloud major version, because Nextcloud upgrades one major
# version at a time: branch nc34 publishes php-fpm-nc34, nginx-nc34 and
# realtime-nc34 with their date and version tags, master publishes the plain
# tags. GitHub starts scheduled runs on the default branch only, so the weekly
# run of master starts this workflow on every nc branch as well; that needs
# «actions: write».

name: docker

on:
  push:
    branches: [master, "nc*"]
  schedule:
    # weekly rebuild, one hour per level after the images it is built on:
    # mwaeckerlin/scratch at 03:17, this repository at level 4
    - cron: "17 7 * * 1"
  workflow_dispatch:

concurrency: docker-${{ github.ref_name }}

jobs:
  docker:
    uses: mwaeckerlin/scratch/.github/workflows/docker-image.yml@master
    permissions:
      actions: write
      contents: read
    with:
      branch-tags: '[{"branch": "nc([0-9]+)", "suffix": "-nc\\1"}]'
      # The runner has no PHPUnit and no `parlwin/vendor` (git-ignored, built in
      # the image), so the plain `npm test` cannot start the PHP suites.
      # `test:ci` fetches both out of the build stage php-vendor first.
      test: npm run test:ci
    secrets: inherit
