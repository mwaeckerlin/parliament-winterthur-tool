  # Die Wege der Parlamentswebseite, wie der Abgleich sie geht. Jede Regel
  # liefert eine echte Aufnahme aus parlwin/tests/Fixtures.

  # Die fünf Listen.
  location = /politbusiness { root ${ROOT}; try_files /html/politbusiness-list.html =404; }
  location = /sitzung { root ${ROOT}; try_files /html/sitzung-list.html =404; }
  location = /kommissionen { root ${ROOT}; try_files /html/kommissionen-list.html =404; }
  location = /fraktionen { root ${ROOT}; try_files /html/fraktionen-list.html =404; }
  location = /stadtparlament/27428 { root ${ROOT}; try_files /html/mitglieder-list.html =404; }

  # Die Detailseite eines Geschäfts. Für zehn Geschäfte liegt die eigene
  # Aufnahme da, darunter die Weisung zum Budget 2027 (2990959); die übrigen
  # 1226 Einträge der Liste beantwortet eine davon, damit der Abgleich seinen
  # ganzen Weg geht, ohne 1226 Aufnahmen im Abbild zu brauchen.
  location ~ ^/_rte/information/(?<geschaeft>[0-9]+)$ {
    root ${ROOT};
    try_files /html/geschaeft-detail-$geschaeft.html /html/geschaeft-detail-2504197.html =404;
  }

  # Die Detailseite einer Sitzung, einer Kommission, einer Fraktion und eines
  # Mitglieds. Ohne eigene Aufnahme antwortet leeres HTML: Dann hat die
  # Behörde keine Mitglieder, und das ist ein Zustand, den der Abgleich kennt.
  location ~ ^/_rte/anlass/(?<sitzung>[0-9]+)$ {
    root ${ROOT};
    try_files /html/sitzung-detail-$sitzung.html /html/leer.html =404;
  }
  # Die Behörden: zuerst die eigene Aufnahme, dann die Kopie, die die Stufe
  # «behoerden» für jede Kennung der Fraktions- und der Kommissionsliste
  # angelegt hat, und zuletzt die leere Seite.
  location ~ ^/_rte/behoerde/(?<behoerde>[0-9]+)$ {
    root ${ROOT};
    try_files /html/kommission-detail-$behoerde.html /html/fraktion-detail-$behoerde.html
              /html/behoerde-$behoerde.html /html/leer.html =404;
  }
  location ~ ^/_rte/person/(?<person>[0-9]+)$ {
    root ${ROOT};
    try_files /html/mitglied-detail-$person.html /html/leer.html =404;
  }

  # Die Stadtratsbeschlüsse (F146). Sie stehen auf der Webseite der Stadt, und
  # der Abgleich zeigt mit PARLWIN_STADT_BASE_URL auf dieselbe Gegenstelle.
  # Die Liste trägt zwölf Beschlüsse; jede ihrer Detailseiten beantwortet die
  # eine Aufnahme, denn geprüft wird der Weg und nicht der Inhalt von zwölf
  # verschiedenen Beschlüssen.
  # Liegt die Datei des Steuerwegs unten, antwortet die Liste mit 500, wie eine
  # Webseite der Stadt, die nicht erreichbar ist.
  location = /stadtratsbeschluesse {
    root ${ROOT};
    if (-f /var/lib/nginx/steuerung/_steuerung/stadtratsbeschluesse-fehler) {
      return 500;
    }
    try_files /html/stadtratsbeschluesse-list.html =404;
  }
  # Der Steuerweg für die E2E-Tests: PUT legt den Fehler der Liste an, DELETE
  # nimmt ihn zurück, GET sagt, ob er gesetzt ist. Die Datei liegt im
  # schreibbaren Verzeichnis von nginx; nur dieses Abbild kennt den Weg.
  location = /_steuerung/stadtratsbeschluesse-fehler {
    root /var/lib/nginx/steuerung;
    dav_methods PUT DELETE;
    create_full_put_path on;
    dav_access user:rw;
    limit_except GET PUT DELETE {
      deny all;
    }
  }
  # Der Ausdruck steht in Anführungszeichen: nginx liest `}` sonst als Ende des
  # Blocks und bricht beim Start mit «directive "location" is not terminated» ab.
  location ~ "^/stadtratsbeschluesse/[0-9]{4}-[0-9]{2}-[0-9]{2}/(?<beschluss>[0-9]+)$" {
    root ${ROOT};
    try_files /html/stadtratsbeschluss-detail-$beschluss.html
              /html/stadtratsbeschluss-detail-20261279.html =404;
  }
  # Die PDF eines Beschlusses: dieselbe Ersatzdatei wie bei den übrigen
  # Dokumenten, damit ein Verweis im Browsertest wirklich etwas liefert.
  location ~ ^/download/resolution-document/ {
    root ${ROOT};
    default_type application/pdf;
    try_files /doc/ersatz.pdf =404;
  }

  # Die Dokumente. Wer eine eigene Datei hat, bekommt sie; alles andere die
  # Ersatzdatei, damit jedes Dokument lesbar ist und nicht als Fehler zählt.
  location ~ ^/_doc/(?<dokument>[0-9]+)$ {
    root ${ROOT};
    default_type application/pdf;
    try_files /doc/$dokument.pdf /doc/ersatz.pdf =404;
  }
