# Zwei Vorgänge dieser Anwendung dauern Minuten: die vollständige
# Synchronisation und der Import eines Budgetbuchs, das Seite für Seite gelesen
# wird. Mit der Vorgabe von nginx (60s) bricht nginx sie mit HTTP 504 ab, und
# der Aufrufer sieht einen Fehler, während die Arbeit im Hintergrund weiterläuft
# — gemessen am 29.09.2026 am Import des Jahrgangs 2018. Die Angabe steht hier,
# weil sie zu dieser Anwendung gehört und nicht zum Basis-Image.
fastcgi_read_timeout 36000s;
fastcgi_send_timeout 36000s;

# Der OCM-Anbieter: Nextcloud liefert ihn unter «/index.php/ocm-provider/»,
# gefragt wird er aber unter «/ocm-provider/». Ohne diese Umleitung antwortet
# nginx mit 404, und die Einrichtungsübersicht meldet «Der Webserver ist nicht
# richtig eingerichtet, um /ocm-provider/ aufzulösen». Gemessen am 23.09.2026:
# «/ocs-provider/» kam mit 200, «/ocm-provider/» mit 404, und über index.php
# beide mit 200.
location ^~ /ocm-provider {
  return 301 /index.php$request_uri;
}

# parlwin Realtime-WebSocket: same-origin Reverse-Proxy auf den internen
# parlwin-realtime-Container.  Wird per Drop-in in /etc/nginx/locations.d/default.conf
# eingebunden, der Server-Block der Basis (mwaeckerlin/nextcloud:nginx)
# includet diese Datei automatisch.
location ^~ /ws/parlwin/ {
  proxy_pass http://parlwin-realtime:3001/ws;
  proxy_http_version 1.1;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection $connection_upgrade;
  proxy_set_header Host $http_host;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_read_timeout 36000s;
  proxy_send_timeout 36000s;
}
